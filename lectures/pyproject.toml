# Environment of the lectures: the mimiclab package and Jupyter.
#   uv:  uv sync          then  uv run jupyter lab
#   pip: python -m venv .venv, activate it, then  pip install -e .
[project]
name = "mimiclab"
version = "0.1.0"
description = "Control of the MimicLab instrument (Arduino UNO R4 + Analog Mimic) for the lectures"
license = "MIT"
authors = [{ name = "TAKAGI Katsuyuki" }]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    # Jupyter for the lecture notebooks
    "jupyterlab>=4",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/mimiclab"]
