; PlatformIO project for development (the learners use the Arduino IDE and the
; AnalogMimic library from the Library Manager).
; Open the repository root in VS Code, open the .ino of a sketch and press Ctrl+Shift+B:
; "PIO: Build current example" or "PIO: Upload current example".
; Sketches are found by their folder name under lectures/ and projects/,
; so the names must be unique in the whole repository.

[platformio]
default_envs = MimicLab
; Local settings that are not committed (e.g. upload_port), if the file exists
extra_configs = platformio_local.ini

[env]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 1000000
monitor_echo = yes
; The library from the working copy next to this repository
lib_deps = symlink://../analog-mimic-arduino
; Switch the source directory to the selected sketch before building
extra_scripts = pre:select_example.py
build_flags = -Wall -Wextra

; Builds the sketch whose .ino is open in the editor (via VS Code task)
[env:current]

; Measuring instrument for the lectures (function generator, 2-channel scope, Mimic control)
[env:MimicLab]
custom_example = MimicLab
