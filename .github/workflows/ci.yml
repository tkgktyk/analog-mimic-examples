name: CI

on: [push, pull_request]

jobs:
  # Every sketch, with the AnalogMimic library from the Library Manager (as the learners use it)
  sketches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: [arduino:renesas_uno:minima, arduino:renesas_uno:unor4wifi]
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - name: AnalogMimic
          sketch-paths: |
            - .

  # mimiclab and every lecture notebook, against a fake instrument
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: lectures
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked pytest

  # The wiring diagrams (schematic.svg) are up to date with their scripts.
  # The scripts use mimic_parts.py of the library, checked out next to this repository.
  schematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: analog-mimic-examples
      - uses: actions/checkout@v6
        with:
          repository: tkgktyk/analog-mimic-arduino
          path: analog-mimic-arduino
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install schemdraw==0.23
      - name: Regenerate the diagrams
        working-directory: analog-mimic-examples
        run: |
          git ls-files '*schematic.py' | while read -r f; do python "$f"; done
          git status --porcelain
          test -z "$(git status --porcelain)"
