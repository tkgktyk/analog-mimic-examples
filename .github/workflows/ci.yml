name: CI

on: [push, pull_request]

jobs:
  # Every sketch, with the AnalogMimic library from the Library Manager (as the learners use it)
  sketches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # build every board even if one fails
      matrix:
        fqbn: [arduino:renesas_uno:minima, arduino:renesas_uno:unor4wifi]
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - name: AnalogMimic
          sketch-paths: |
            - .

  # mimiclab and every lecture notebook, against a fake instrument
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: lectures
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked pytest

  # The figures (schematic.svg, circuit.svg, response.svg) are up to date with their
  # scripts. The scripts use mimic_parts.py of the library, checked out next to this
  # repository, and the versions of schemdraw / matplotlib locked in lectures/uv.lock.
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: analog-mimic-examples
      - uses: actions/checkout@v6
        with:
          repository: tkgktyk/analog-mimic-arduino
          path: analog-mimic-arduino
      - uses: astral-sh/setup-uv@v7
      - name: Regenerate the figures
        working-directory: analog-mimic-examples
        run: |
          uv sync --locked --project lectures
          git ls-files '*schematic.py' '*circuit.py' '*response.py' | while read -r f; do
            uv run --locked --project lectures python "$f"
          done
          git status --porcelain
          test -z "$(git status --porcelain)"
